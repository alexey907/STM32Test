[env:bluepill_f103c8]

upload_protocol = jlink
debug_tool=jlink
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
lib_deps =
    ; A clean FreeRTOS port for PlatformIO
    bojit/PlatformIO-FreeRTOS @ ^2.1.3
    ; TinyUSB — USB device stack with CDC (Virtual Serial)
    baracodadailyhealthtech/tinyusb @ ^0.17.0
build_flags = 
    -D STM32F103xB
    ; Tell PlatformIO to compile the STM32 driver and FreeRTOS OSAL
    -D CFG_TUSB_MCU=OPT_MCU_STM32F1
    -D CFG_TUSB_OS=OPT_OS_FREERTOS
    ; FreeRTOS headers for TinyUSB OSAL
    -I .pio/libdeps/bluepill_f103c8/PlatformIO-FreeRTOS/FreeRTOS-Kernel/include
    -I .pio/libdeps/bluepill_f103c8/PlatformIO-FreeRTOS/FreeRTOS-Kernel/portable/GCC/ARM_CM3